name: campus-life

x-common-env: &common-env
  TZ: ${TZ:-Asia/Shanghai}
  JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_long_random_jwt_secret_at_least_32_bytes}
  DEMO_PUBLIC_BASE_URL: ${DEMO_PUBLIC_BASE_URL:-http://localhost}

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_mysql_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_life_demo}
      MYSQL_USER: ${MYSQL_USER:-campus_demo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_mysql_password}
      AI_MYSQL_DATABASE: ${AI_MYSQL_DATABASE:-campus_life_ai_demo}
      AI_MYSQL_USER: ${AI_MYSQL_USER:-campus_life_ai_user}
      AI_MYSQL_PASSWORD: ${AI_MYSQL_PASSWORD:-CHANGE_ME_ai_mysql_password}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init/10-init-main-db.sh:/docker-entrypoint-initdb.d/10-init-main-db.sh:ro
      - ./mysql/init/20-init-ai-db.sh:/docker-entrypoint-initdb.d/20-init-ai-db.sh:ro
      - ../../campus-life-backend/docs:/docker-entrypoint-initdb.d/sql/backend-docs:ro
      - ../../campus-life-backend/src/main/resources/sql:/docker-entrypoint-initdb.d/sql/backend-migrations:ro
      - ../../campus-life-ai/src/main/resources/db/migration:/docker-entrypoint-initdb.d/sql/ai-migrations:ro
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - campus-life

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME_redis_password}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - campus-life

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3-management}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-campus_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-CHANGE_ME_rabbitmq_password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - campus-life

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9-eclipse-temurin-17}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:17-jre}
    image: campus-life-backend:docker
    restart: unless-stopped
    environment:
      <<: *common-env
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_life_demo}
      MYSQL_USER: ${MYSQL_USER:-campus_demo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_mysql_password}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME_redis_password}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-campus_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-CHANGE_ME_rabbitmq_password}
      ALIPAY_ENABLED: ${ALIPAY_ENABLED:-false}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_SKIP_NOTIFY_SIGN_VERIFY: ${ALIPAY_SKIP_NOTIFY_SIGN_VERIFY:-false}
      ALIPAY_GATEWAY_URL: ${ALIPAY_GATEWAY_URL:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-http://localhost/api/payment/alipay/notify}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-http://localhost/api/payment/alipay/return}
      WECHAT_ENABLED: ${WECHAT_ENABLED:-false}
    command:
      - --spring.profiles.active=docker
      - --spring.config.additional-location=file:/app/config/
    volumes:
      - ./config/backend:/app/config:ro
      - uploads-data:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - campus-life

  ai:
    build:
      context: ../..
      dockerfile: deploy/docker/ai/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9-eclipse-temurin-17}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:17-jre}
    image: campus-life-ai:docker
    restart: unless-stopped
    environment:
      <<: *common-env
      JAVA_OPTS: ${AI_JAVA_OPTS:-}
      AI_MYSQL_DATABASE: ${AI_MYSQL_DATABASE:-campus_life_ai_demo}
      AI_MYSQL_USER: ${AI_MYSQL_USER:-campus_life_ai_user}
      AI_MYSQL_PASSWORD: ${AI_MYSQL_PASSWORD:-CHANGE_ME_ai_mysql_password}
      AI_API_KEY_ENCRYPTION_SECRET: ${AI_API_KEY_ENCRYPTION_SECRET:-CHANGE_ME_32_BYTE_AI_SECRET_VALUE}
      AI_DEFAULT_PROVIDER_CODE: ${AI_DEFAULT_PROVIDER_CODE:-openai-compatible}
      AI_OPENAI_COMPATIBLE_ENABLED: ${AI_OPENAI_COMPATIBLE_ENABLED:-false}
      AI_OPENAI_COMPATIBLE_PROVIDER_NAME: ${AI_OPENAI_COMPATIBLE_PROVIDER_NAME:-Qwen}
      AI_OPENAI_COMPATIBLE_BASE_URL: ${AI_OPENAI_COMPATIBLE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_OPENAI_COMPATIBLE_API_KEY: ${AI_OPENAI_COMPATIBLE_API_KEY:-}
      AI_OPENAI_COMPATIBLE_MODEL: ${AI_OPENAI_COMPATIBLE_MODEL:-qwen-plus}
      AI_DEFAULT_MODEL_CODE: ${AI_DEFAULT_MODEL_CODE:-qwen-plus}
      AI_KNOWLEDGE_VECTOR_ENABLED: ${AI_KNOWLEDGE_VECTOR_ENABLED:-false}
      AI_KNOWLEDGE_VECTOR_FALLBACK_KEYWORD_SEARCH: ${AI_KNOWLEDGE_VECTOR_FALLBACK_KEYWORD_SEARCH:-true}
    command:
      - --spring.profiles.active=docker
      - --spring.config.additional-location=file:/app/config/
    volumes:
      - ./config/ai:/app/config:ro
      - ai-knowledge-data:/app/data/ai-knowledge
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - campus-life

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/gateway/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9-eclipse-temurin-17}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:17-jre}
    image: campus-life-gateway:docker
    restart: unless-stopped
    environment:
      <<: *common-env
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME_redis_password}
    command:
      - --spring.config.additional-location=file:/app/config/
    volumes:
      - ./config/gateway:/app/config:ro
    depends_on:
      backend:
        condition: service_started
      ai:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - campus-life

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    image: campus-life-frontend:docker
    restart: unless-stopped
    environment:
      CONSUMER_SERVER_NAME: ${CONSUMER_SERVER_NAME:-localhost}
      MERCHANT_SERVER_NAME: ${MERCHANT_SERVER_NAME:-merchant.localhost}
      ADMIN_SERVER_NAME: ${ADMIN_SERVER_NAME:-admin.localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - campus-life

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  uploads-data:
  ai-knowledge-data:

networks:
  campus-life:
    driver: bridge
