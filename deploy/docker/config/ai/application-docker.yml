server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${AI_MYSQL_DATABASE:campus_life_ai_demo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${AI_MYSQL_USER:campus_life_ai_user}
    password: ${AI_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

jwt:
  secret: ${JWT_SECRET:please-change-this-docker-secret}
  expiration: 604800000
  refresh-expiration: 2592000000

platform:
  user-service:
    base-url: http://backend:8080

ai:
  security:
    api-key-encryption-secret: ${AI_API_KEY_ENCRYPTION_SECRET:}
  default-provider-code: ${AI_DEFAULT_PROVIDER_CODE:openai-compatible}
  default-model-code: ${AI_DEFAULT_MODEL_CODE:qwen-plus}
  default-assistant-type: ${AI_DEFAULT_ASSISTANT_TYPE:general}
  max-context-messages: ${AI_MAX_CONTEXT_MESSAGES:20}
  temperature: ${AI_TEMPERATURE:0.7}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}
  openai-compatible:
    enabled: ${AI_OPENAI_COMPATIBLE_ENABLED:false}
    provider-code: ${AI_OPENAI_COMPATIBLE_PROVIDER_CODE:openai-compatible}
    provider-name: ${AI_OPENAI_COMPATIBLE_PROVIDER_NAME:Qwen}
    base-url: ${AI_OPENAI_COMPATIBLE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${AI_OPENAI_COMPATIBLE_API_KEY:}
    model: ${AI_OPENAI_COMPATIBLE_MODEL:qwen-plus}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000

knowledge:
  storage:
    root-path: /app/data/ai-knowledge
    allowed-extensions: txt,md
    max-file-size-bytes: 10485760
    max-user-storage-bytes: 209715200
    max-user-bases: 20
    chunk-max-size: 800
    chunk-overlap: 100
  embedding:
    base-url: ${AI_KNOWLEDGE_EMBEDDING_BASE_URL:${AI_OPENAI_COMPATIBLE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
    api-key: ${AI_KNOWLEDGE_EMBEDDING_API_KEY:${AI_OPENAI_COMPATIBLE_API_KEY:}}
    model: ${AI_KNOWLEDGE_EMBEDDING_MODEL:text-embedding-v4}
    dimensions: ${AI_KNOWLEDGE_EMBEDDING_DIMENSIONS:1024}
  vector:
    enabled: ${AI_KNOWLEDGE_VECTOR_ENABLED:false}
    fallback-keyword-search: ${AI_KNOWLEDGE_VECTOR_FALLBACK_KEYWORD_SEARCH:true}

ops:
  prometheus:
    enabled: false
  logs:
    provider: none
    cls:
      enabled: false
  service-probes:
    - code: ai-service
      name: 校园 AI 服务
      health-url: http://ai:8083/actuator/health
    - code: campus-backend
      name: 校园业务后端
      health-url: http://backend:8080/actuator/health
    - code: api-gateway
      name: 校园 API 网关
      health-url: http://gateway:8090/actuator/health

