server:
  port: 8080
  forward-headers-strategy: framework

app:
  cors:
    allowed-origin-patterns: ${DEMO_PUBLIC_BASE_URL:http://localhost}

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:campus_life_demo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USER:campus_demo}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 3000
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:campus_mq}
    password: ${RABBITMQ_DEFAULT_PASS:}
    virtual-host: /
    connection-timeout: 3000
  elasticsearch:
    uris: http://elasticsearch:9200
  kafka:
    bootstrap-servers: kafka:9092
    listener:
      missing-topics-fatal: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

event:
  reliability:
    schema-auto-init: true
  monitoring:
    enabled: false
    kafka-lag:
      enabled: false
  outbox:
    enabled: false

management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    elasticsearch:
      enabled: false

jwt:
  secret: ${JWT_SECRET:please-change-this-docker-secret}
  expiration: 604800000
  refresh-expiration: 2592000000

file:
  storage:
    type: local
  upload:
    path: /app/data/uploads
    url-prefix: /uploads
    public-base-url: ${DEMO_PUBLIC_BASE_URL:http://localhost}

payment:
  frontend-base-url: ${DEMO_PUBLIC_BASE_URL:http://localhost}
  alipay:
    enabled: ${ALIPAY_ENABLED:false}
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    skip-notify-sign-verify: ${ALIPAY_SKIP_NOTIFY_SIGN_VERIFY:false}
    gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    notify-url: ${ALIPAY_NOTIFY_URL:http://localhost/api/payment/alipay/notify}
    return-url: ${ALIPAY_RETURN_URL:http://localhost/api/payment/alipay/return}
  wechat:
    enabled: ${WECHAT_ENABLED:false}

search:
  kafka:
    enabled: false
  es:
    enabled: false
  compensation:
    enabled: false

notification:
  kafka:
    enabled: false

voucher:
  seckill:
    consumer:
      enabled: true
  order:
    kafka:
      enabled: false

