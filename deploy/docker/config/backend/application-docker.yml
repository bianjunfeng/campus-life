server:
  port: 8080
  forward-headers-strategy: framework

app:
  cors:
    allowed-origin-patterns: ${DEMO_PUBLIC_BASE_URL:http://localhost}

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:campus_life_demo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USER:campus_demo}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 3000
    elasticsearch:
      repositories:
        enabled: false
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:campus_mq}
    password: ${RABBITMQ_DEFAULT_PASS:}
    virtual-host: /
    connection-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

event:
  reliability:
    schema-auto-init: true
  monitoring:
    enabled: false
    kafka-lag:
      enabled: false
  outbox:
    enabled: false

management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    elasticsearch:
      enabled: false

jwt:
  secret: ${JWT_SECRET:please-change-this-docker-secret}
  expiration: 604800000
  refresh-expiration: 2592000000

auth:
  verification-code:
    secret: ${AUTH_VERIFICATION_CODE_SECRET:${JWT_SECRET:please-change-this-docker-secret}}
  sms:
    provider: ${AUTH_SMS_PROVIDER:}
    http:
      endpoint: ${AUTH_SMS_HTTP_ENDPOINT:}
      api-key: ${AUTH_SMS_HTTP_API_KEY:}
      api-key-header: ${AUTH_SMS_HTTP_API_KEY_HEADER:X-API-Key}
      sign-name: ${AUTH_SMS_SIGN_NAME:}
      template-code: ${AUTH_SMS_TEMPLATE_CODE:}
      connect-timeout-ms: ${AUTH_SMS_HTTP_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${AUTH_SMS_HTTP_READ_TIMEOUT_MS:5000}

file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}
  upload:
    path: data/uploads
    url-prefix: /uploads
    public-base-url: ${DEMO_PUBLIC_BASE_URL:http://localhost}
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
    url-prefix: ${OSS_URL_PREFIX:}

payment:
  frontend-base-url: ${DEMO_PUBLIC_BASE_URL:http://localhost}
  alipay:
    enabled: ${ALIPAY_ENABLED:false}
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    skip-notify-sign-verify: ${ALIPAY_SKIP_NOTIFY_SIGN_VERIFY:false}
    gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    notify-url: ${ALIPAY_NOTIFY_URL:http://localhost/api/payment/alipay/notify}
    return-url: ${ALIPAY_RETURN_URL:http://localhost/api/payment/alipay/return}
  wechat:
    enabled: ${WECHAT_ENABLED:false}

search:
  kafka:
    enabled: false
  es:
    enabled: false
  compensation:
    enabled: false

notification:
  kafka:
    enabled: false

voucher:
  seckill:
    consumer:
      enabled: true
  order:
    kafka:
      enabled: false
