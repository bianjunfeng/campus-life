server:
  port: 8080
  forward-headers-strategy: framework

app:
  cors:
    allowed-origin-patterns: https://demo.example.com,http://YOUR_SERVER_IP

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/campus_life?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: campus_user
    password: CHANGE_ME_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: CHANGE_ME_REDIS_PASSWORD
      timeout: 3000
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: campus_mq
    password: CHANGE_ME_RABBITMQ_PASSWORD
    virtual-host: /
    connection-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

jwt:
  secret: CHANGE_ME_TO_A_LONG_RANDOM_SECRET
  expiration: 604800000
  refresh-expiration: 2592000000

file:
  storage:
    type: local
  upload:
    path: /opt/campus-life/data/uploads
    url-prefix: /uploads
    public-base-url: https://demo.example.com

payment:
  frontend-base-url: https://demo.example.com
  alipay:
    enabled: false
  wechat:
    enabled: false

search:
  kafka:
    enabled: false
  es:
    enabled: false
  compensation:
    enabled: false

notification:
  kafka:
    enabled: false

voucher:
  seckill:
    consumer:
      enabled: true
