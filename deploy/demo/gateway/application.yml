server:
  port: 8090
  forward-headers-strategy: framework

spring:
  application:
    name: campus-life-gateway
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0

gateway:
  backend-uri: http://127.0.0.1:8080
  voucher-uri: http://127.0.0.1:8080
  ai-uri: http://127.0.0.1:8083
  rate-limit:
    replenish-rate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:80}
    burst-capacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:160}
    requested-tokens: 1
  auth:
    enabled: true
    jwt-secret: ${JWT_SECRET:please-change-this-demo-secret}
