groups:
  - name: campus-life-runtime
    rules:
      - alert: HighJvmHeapUsage
        expr: |
          100 * sum by (application, instance) (jvm_memory_used_bytes{area="heap"})
          /
          sum by (application, instance) (jvm_memory_max_bytes{area="heap"}) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} JVM heap usage is high"
          description: "{{ $labels.application }} on {{ $labels.instance }} JVM heap usage is above 85% for 5 minutes. Current value: {{ printf \"%.2f\" $value }}%."

      - alert: ServiceDown
        expr: up{job=~"campus-life-.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}."

      - alert: HighHttpServerErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum by (application) (rate(http_server_requests_seconds_count[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} HTTP 5xx rate is high"
          description: "{{ $labels.application }} 5xx rate is above 5% for 5 minutes. Current value: {{ printf \"%.4f\" $value }}."
