global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - campus-life-alerts.yml

scrape_configs:
  - job_name: campus-life-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - localhost:8080
        labels:
          service: campus-life-backend

  - job_name: campus-life-ai
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - localhost:8083
        labels:
          service: campus-life-ai

  - job_name: campus-life-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - localhost:8090
        labels:
          service: campus-life-gateway
